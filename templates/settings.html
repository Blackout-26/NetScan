<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NetScan — Settings</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <style>
    :root { --ns-dark:#0f172a; --ns-panel:#1e293b; --ns-border:#334155; --ns-accent:#38bdf8; }
    body { background:var(--ns-dark); color:#e2e8f0; font-family:'Segoe UI',system-ui,sans-serif; }
    .sidebar { width:240px; min-height:100vh; background:var(--ns-panel); border-right:1px solid var(--ns-border); position:fixed; top:0; left:0; z-index:100; }
    .sidebar .brand { font-size:1.4rem; font-weight:700; color:var(--ns-accent); padding:1.25rem 1.5rem; border-bottom:1px solid var(--ns-border); }
    .sidebar .brand span { color:#f1f5f9; }
    .sidebar .nav-link { color:#94a3b8; padding:.65rem 1.5rem; display:flex; align-items:center; gap:.6rem; font-size:.9rem; }
    .sidebar .nav-link:hover,.sidebar .nav-link.active { background:rgba(56,189,248,.08); color:var(--ns-accent); }
    .main { margin-left:240px; padding:2rem; }
    .card-dark { background:var(--ns-panel); border:1px solid var(--ns-border); border-radius:12px; padding:2rem; max-width:520px; }
    .form-control { background:#0f172a; border:1px solid var(--ns-border); color:#e2e8f0; border-radius:8px; }
    .form-control:focus { background:#0f172a; border-color:var(--ns-accent); color:#e2e8f0; box-shadow:0 0 0 3px rgba(56,189,248,.15); }
    .form-label { color:#94a3b8; font-size:.875rem; }
    .btn-save { background:var(--ns-accent); color:#0f172a; font-weight:700; border:none; border-radius:8px; padding:.6rem 1.5rem; }
    .btn-save:hover { opacity:.9; color:#0f172a; }
    .req-item { font-size:.78rem; color:#64748b; }
    .req-item.met { color:#4ade80; }
    .alert-success-dark { background:rgba(74,222,128,.1); border:1px solid rgba(74,222,128,.3); color:#86efac; border-radius:8px; padding:.75rem 1rem; font-size:.875rem; }
    .alert-error { background:rgba(239,68,68,.1); border:1px solid rgba(239,68,68,.3); color:#fca5a5; border-radius:8px; padding:.75rem 1rem; font-size:.875rem; }
    .eye-toggle { background:#0f172a; border:1px solid var(--ns-border); border-left:none; color:#64748b; cursor:pointer; border-radius:0 8px 8px 0; }
    .eye-toggle:hover { color:var(--ns-accent); background:#0f172a; }
    .user-pill { background:rgba(56,189,248,.1); border:1px solid rgba(56,189,248,.2); border-radius:20px; padding:.3rem 1rem; font-size:.85rem; color:var(--ns-accent); display:inline-flex; align-items:center; gap:.4rem; }
  </style>
</head>
<body>
<nav class="sidebar d-flex flex-column">
  <div class="brand"><i class="bi bi-radar"></i> Net<span>Scan</span></div>
  <ul class="nav flex-column mt-2">
    <li><a class="nav-link" href="/"><i class="bi bi-speedometer2"></i> Dashboard</a></li>
    <li><a class="nav-link" href="/scans"><i class="bi bi-list-check"></i> Scan History</a></li>
    <li><a class="nav-link active" href="/settings"><i class="bi bi-gear"></i> Settings</a></li>
    <li><a class="nav-link" href="/api/docs"><i class="bi bi-code-slash"></i> API Docs</a></li>
  </ul>
  <div class="mt-auto p-3">
    <button class="btn btn-outline-danger btn-sm w-100" onclick="doLogout()">
      <i class="bi bi-box-arrow-right me-1"></i>Logout
    </button>
  </div>
</nav>

<main class="main">
  <h1 class="fs-4 fw-bold mb-1"><i class="bi bi-gear me-2 text-info"></i>Settings</h1>
  <p class="text-muted small mb-4">Manage your admin credentials</p>

  <div class="card-dark">
    <!-- Current user info -->
    <div class="mb-4 d-flex align-items-center gap-2">
      <span class="text-muted small">Logged in as</span>
      <span class="user-pill"><i class="bi bi-person-fill"></i><span id="current-username">{{ username }}</span></span>
    </div>

    <h5 class="mb-3 fw-semibold">Change Credentials</h5>

    <div id="msg-box" class="mb-3 d-none"></div>

    <div class="mb-3">
      <label class="form-label">New Username</label>
      <input id="new-username" type="text" class="form-control" value="{{ username }}" autocomplete="username" />
    </div>
    <div class="mb-3">
      <label class="form-label">New Password</label>
      <div class="input-group">
        <input id="new-password" type="password" class="form-control" placeholder="Leave blank to keep current" autocomplete="new-password" oninput="checkStrength()" />
        <button class="eye-toggle btn" type="button" onclick="toggleVis('new-password','eye1')">
          <i class="bi bi-eye" id="eye1"></i>
        </button>
      </div>
      <div class="mt-2 ps-1" id="pw-reqs" style="display:none;">
        <div class="req-item" id="req-length"><i class="bi bi-circle"></i> At least 8 characters</div>
        <div class="req-item" id="req-upper"><i class="bi bi-circle"></i> At least one uppercase letter</div>
        <div class="req-item" id="req-digit"><i class="bi bi-circle"></i> At least one digit</div>
      </div>
    </div>
    <div class="mb-4">
      <label class="form-label">Confirm New Password</label>
      <div class="input-group">
        <input id="confirm-password" type="password" class="form-control" placeholder="••••••••••••" autocomplete="new-password" />
        <button class="eye-toggle btn" type="button" onclick="toggleVis('confirm-password','eye2')">
          <i class="bi bi-eye" id="eye2"></i>
        </button>
      </div>
    </div>
    <button id="btn-save" class="btn btn-save" type="button" onclick="doSave()">
      <i class="bi bi-floppy me-1"></i>Save Changes
    </button>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
const API = '/api/v1';

function toggleVis(inputId, iconId) {
  const el = document.getElementById(inputId);
  const icon = document.getElementById(iconId);
  el.type = el.type === 'password' ? 'text' : 'password';
  icon.className = el.type === 'password' ? 'bi bi-eye' : 'bi bi-eye-slash';
}

function checkStrength() {
  const pw = document.getElementById('new-password').value;
  document.getElementById('pw-reqs').style.display = pw.length ? '' : 'none';
  const setReq = (id, met) => {
    const el = document.getElementById(id);
    el.className = 'req-item' + (met ? ' met' : '');
    el.querySelector('i').className = met ? 'bi bi-check-circle-fill' : 'bi bi-circle';
  };
  setReq('req-length', pw.length >= 8);
  setReq('req-upper', /[A-Z]/.test(pw));
  setReq('req-digit', /\d/.test(pw));
}

function showMsg(text, type) {
  const box = document.getElementById('msg-box');
  box.className = type === 'success' ? 'alert-success-dark mb-3' : 'alert-error mb-3';
  box.textContent = text;
  box.classList.remove('d-none');
  setTimeout(() => box.classList.add('d-none'), 5000);
}

async function doSave() {
  const newUsername = document.getElementById('new-username').value.trim();
  const newPassword = document.getElementById('new-password').value;
  const confirmPassword = document.getElementById('confirm-password').value;
  const btn = document.getElementById('btn-save');

  if (!newUsername) { showMsg('Username cannot be empty.', 'error'); return; }
  if (!newPassword) { showMsg('Please enter a new password.', 'error'); return; }
  if (newPassword !== confirmPassword) { showMsg('Passwords do not match.', 'error'); return; }

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>Saving…';

  try {
    const res = await fetch(`${API}/auth/update-credentials`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ new_username: newUsername, new_password: newPassword, confirm_password: confirmPassword }),
      credentials: 'same-origin',
    });
    const data = await res.json();
    if (res.ok) {
      showMsg('Credentials updated successfully!', 'success');
      document.getElementById('current-username').textContent = newUsername;
      document.getElementById('new-password').value = '';
      document.getElementById('confirm-password').value = '';
      document.getElementById('pw-reqs').style.display = 'none';
    } else {
      showMsg(data.detail || 'Update failed.', 'error');
    }
  } catch (e) {
    showMsg('Network error.', 'error');
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<i class="bi bi-floppy me-1"></i>Save Changes';
  }
}

async function doLogout() {
  await fetch(`${API}/auth/logout`, { method: 'POST', credentials: 'same-origin' });
  window.location.href = '/login';
}
</script>
</body>
</html>
