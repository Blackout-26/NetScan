<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NetScan — Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <style>
    :root {
      --ns-dark: #0f172a;
      --ns-panel: #1e293b;
      --ns-border: #334155;
      --ns-accent: #38bdf8;
      --ns-green: #4ade80;
    }
    body { background: var(--ns-dark); color: #e2e8f0; font-family: 'Segoe UI', system-ui, sans-serif; }
    .sidebar { width: 240px; min-height: 100vh; background: var(--ns-panel); border-right: 1px solid var(--ns-border); position: fixed; top: 0; left: 0; z-index: 100; }
    .sidebar .brand { font-size: 1.4rem; font-weight: 700; color: var(--ns-accent); padding: 1.25rem 1.5rem; border-bottom: 1px solid var(--ns-border); }
    .sidebar .brand span { color: #f1f5f9; }
    .sidebar .nav-link { color: #94a3b8; padding: .65rem 1.5rem; border-radius: 0; display: flex; align-items: center; gap: .6rem; font-size: .9rem; }
    .sidebar .nav-link:hover, .sidebar .nav-link.active { background: rgba(56,189,248,.08); color: var(--ns-accent); }
    .sidebar .nav-link i { font-size: 1rem; }
    .main { margin-left: 240px; padding: 2rem; }
    .stat-card { background: var(--ns-panel); border: 1px solid var(--ns-border); border-radius: 12px; padding: 1.5rem; }
    .stat-card .label { font-size: .8rem; color: #64748b; text-transform: uppercase; letter-spacing: .05em; }
    .stat-card .value { font-size: 2.2rem; font-weight: 700; line-height: 1.1; }
    .badge-risk-High   { background: #fee2e2; color: #991b1b; }
    .badge-risk-Medium { background: #fef3c7; color: #92400e; }
    .badge-risk-Low    { background: #dcfce7; color: #166534; }
    .badge-risk-Info   { background: #f1f5f9; color: #475569; }
    .scan-form { background: var(--ns-panel); border: 1px solid var(--ns-border); border-radius: 12px; padding: 1.5rem; }
    table { border-collapse: separate; border-spacing: 0; }
    .table-dark-ns { background: var(--ns-panel); color: #e2e8f0; }
    .table-dark-ns th { background: #1e293b; border-bottom: 1px solid var(--ns-border); color: #94a3b8; font-size: .78rem; text-transform: uppercase; letter-spacing: .05em; }
    .table-dark-ns td { border-bottom: 1px solid #1e293b; font-size: .875rem; vertical-align: middle; }
    .table-dark-ns tr:hover td { background: rgba(56,189,248,.04); }
    .toast-container { position: fixed; bottom: 1.5rem; right: 1.5rem; z-index: 9999; }
    .spinner-border-sm { width: 1rem; height: 1rem; }
    #risk-chart-wrap canvas { max-height: 180px; }
  </style>
</head>
<body>

<!-- ── Sidebar ──────────────────────────────────────────────────────────────── -->
<nav class="sidebar d-flex flex-column">
  <div class="brand"><i class="bi bi-radar"></i> Net<span>Scan</span></div>
  <ul class="nav flex-column mt-2">
    <li class="nav-item"><a class="nav-link active" href="/"><i class="bi bi-speedometer2"></i> Dashboard</a></li>
    <li class="nav-item"><a class="nav-link" href="/scans"><i class="bi bi-list-check"></i> Scan History</a></li>
    <li class="nav-item"><a class="nav-link" href="/settings"><i class="bi bi-gear"></i> Settings</a></li>
    <li class="nav-item"><a class="nav-link" href="/api/docs"><i class="bi bi-code-slash"></i> API Docs</a></li>
  </ul>
  <div class="mt-auto p-3">
    <button class="btn btn-outline-danger btn-sm w-100" onclick="fetch('/api/v1/auth/logout',{method:'POST',credentials:'same-origin'}).then(()=>window.location.href='/login')">
      <i class="bi bi-box-arrow-right me-1"></i>Logout
    </button>
  </div>
</nav>

<!-- ── Main Content ─────────────────────────────────────────────────────────── -->
<main class="main">
  <div class="d-flex align-items-center justify-content-between mb-4">
    <h1 class="fs-4 fw-bold mb-0"><i class="bi bi-speedometer2 me-2 text-info"></i>Dashboard</h1>
    <span id="active-badge" class="badge bg-success d-none"><i class="bi bi-circle-fill me-1" style="font-size:.5rem;"></i>Scan Running</span>
  </div>

  <!-- ── Stats row ────────────────────────────────────────────────────────── -->
  <div class="row g-3 mb-4">
    <div class="col-6 col-lg-3">
      <div class="stat-card">
        <div class="label">Total Scans</div>
        <div class="value text-info" id="stat-scans">—</div>
      </div>
    </div>
    <div class="col-6 col-lg-3">
      <div class="stat-card">
        <div class="label">Devices Found</div>
        <div class="value text-light" id="stat-devices">—</div>
      </div>
    </div>
    <div class="col-6 col-lg-3">
      <div class="stat-card">
        <div class="label">Open Ports</div>
        <div class="value text-warning" id="stat-ports">—</div>
      </div>
    </div>
    <div class="col-6 col-lg-3">
      <div class="stat-card">
        <div class="label">High Risk Devices</div>
        <div class="value text-danger" id="stat-high">—</div>
      </div>
    </div>
  </div>

  <div class="row g-3 mb-4">
    <!-- ── New Scan Form ───────────────────────────────────────────────────── -->
    <div class="col-lg-5">
      <div class="scan-form h-100">
        <h5 class="mb-3"><i class="bi bi-plus-circle me-2 text-info"></i>Start New Scan</h5>
        <div class="mb-3">
          <label class="form-label text-muted small">Target (IP / CIDR / Hostname)</label>
          <input id="scan-target" type="text" class="form-control bg-dark border-secondary text-light"
                 placeholder="e.g. 192.168.1.0/24 or 10.0.0.1" />
        </div>
        <div class="mb-3">
          <label class="form-label text-muted small">Scan Type</label>
          <select id="scan-type" class="form-select bg-dark border-secondary text-light">
            <option value="quick">Quick — Top 1000 ports</option>
            <option value="full" selected>Full — All 65535 ports</option>
            <option value="service">Service — Version detection</option>
          </select>
        </div>
        <button id="btn-scan" class="btn btn-info w-100 fw-semibold">
          <i class="bi bi-play-fill me-1"></i>Launch Scan
        </button>
      </div>
    </div>

    <!-- ── Risk Breakdown ─────────────────────────────────────────────────── -->
    <div class="col-lg-7">
      <div class="stat-card h-100">
        <h5 class="mb-3"><i class="bi bi-shield-exclamation me-2 text-warning"></i>Risk Breakdown</h5>
        <div id="risk-chart-wrap">
          <canvas id="risk-chart"></canvas>
        </div>
        <div class="row text-center mt-3" id="risk-breakdown-counts">
          <div class="col"><span class="badge badge-risk-High px-3 py-2" id="rb-high">High: —</span></div>
          <div class="col"><span class="badge badge-risk-Medium px-3 py-2" id="rb-medium">Medium: —</span></div>
          <div class="col"><span class="badge badge-risk-Low px-3 py-2" id="rb-low">Low: —</span></div>
          <div class="col"><span class="badge badge-risk-Info px-3 py-2" id="rb-info">Info: —</span></div>
        </div>
      </div>
    </div>
  </div>

  <!-- ── Recent Scans Table ───────────────────────────────────────────────── -->
  <div class="stat-card">
    <h5 class="mb-3"><i class="bi bi-clock-history me-2 text-info"></i>Recent Scans</h5>
    <div class="table-responsive">
      <table class="table table-dark-ns mb-0">
        <thead>
          <tr>
            <th>Target</th><th>Type</th><th>Status</th>
            <th>Hosts</th><th>Open Ports</th><th>Started</th><th>Actions</th>
          </tr>
        </thead>
        <tbody id="recent-scans-body">
          <tr><td colspan="7" class="text-center py-4 text-muted">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</main>

<!-- ── Toast ─────────────────────────────────────────────────────────────────── -->
<div class="toast-container">
  <div id="toast" class="toast align-items-center text-bg-dark border border-secondary" role="alert">
    <div class="d-flex">
      <div class="toast-body" id="toast-body"></div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<script>
const API = '/api/v1';
let riskChart = null;

function toast(msg, type='info') {
  const el = document.getElementById('toast');
  el.className = `toast align-items-center text-bg-${type} border-0`;
  document.getElementById('toast-body').textContent = msg;
  bootstrap.Toast.getOrCreateInstance(el, {delay: 4000}).show();
}

function statusBadge(s) {
  const map = {pending:'secondary', running:'primary', completed:'success', failed:'danger', cancelled:'warning'};
  return `<span class="badge bg-${map[s]||'secondary'}">${s}</span>`;
}

function fmtDate(d) {
  if (!d) return '—';
  return new Date(d).toLocaleString();
}

async function loadStats() {
  try {
    const r = await fetch(`${API}/dashboard/stats`);
    const d = await r.json();
    document.getElementById('stat-scans').textContent   = d.total_scans;
    document.getElementById('stat-devices').textContent = d.total_devices;
    document.getElementById('stat-ports').textContent   = d.total_open_ports;
    document.getElementById('stat-high').textContent    = d.risk_breakdown.high;
    document.getElementById('rb-high').textContent      = `High: ${d.risk_breakdown.high}`;
    document.getElementById('rb-medium').textContent    = `Medium: ${d.risk_breakdown.medium}`;
    document.getElementById('rb-low').textContent       = `Low: ${d.risk_breakdown.low}`;
    document.getElementById('rb-info').textContent      = `Info: ${d.risk_breakdown.info}`;
    if (d.active_scans > 0) document.getElementById('active-badge').classList.remove('d-none');
    else document.getElementById('active-badge').classList.add('d-none');

    // Chart
    const rb = d.risk_breakdown;
    const ctx = document.getElementById('risk-chart').getContext('2d');
    if (riskChart) riskChart.destroy();
    riskChart = new Chart(ctx, {
      type: 'doughnut',
      data: {
        labels: ['High', 'Medium', 'Low', 'Info'],
        datasets: [{
          data: [rb.high, rb.medium, rb.low, rb.info],
          backgroundColor: ['#ef4444','#f59e0b','#22c55e','#64748b'],
          borderWidth: 0,
        }]
      },
      options: { plugins: { legend: { labels: { color: '#94a3b8' } } }, cutout: '65%' }
    });

    // Recent scans
    const tbody = document.getElementById('recent-scans-body');
    if (!d.recent_scans.length) {
      tbody.innerHTML = '<tr><td colspan="7" class="text-center py-4 text-muted">No scans yet. Start one above.</td></tr>';
      return;
    }
    tbody.innerHTML = d.recent_scans.map(s => `
      <tr>
        <td><code class="text-info">${s.target}</code></td>
        <td><span class="badge bg-secondary">${s.scan_type}</span></td>
        <td>${statusBadge(s.status)}</td>
        <td>${s.total_hosts}</td>
        <td>${s.open_ports}</td>
        <td class="text-muted">${fmtDate(s.started_at)}</td>
        <td><a href="/scans/${s.uuid}" class="btn btn-outline-info btn-sm">View</a></td>
      </tr>
    `).join('');
  } catch (e) {
    console.error(e);
  }
}

document.getElementById('btn-scan').addEventListener('click', async () => {
  const target = document.getElementById('scan-target').value.trim();
  const type   = document.getElementById('scan-type').value;
  if (!target) { toast('Please enter a target.', 'warning'); return; }

  const btn = document.getElementById('btn-scan');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Launching…';

  try {
    const r = await fetch(`${API}/scans/`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({target, scan_type: type}),
    });
    const data = await r.json();
    if (r.ok) {
      toast(`Scan launched! UUID: ${data.uuid}`, 'success');
      setTimeout(() => { window.location.href = `/scans/${data.uuid}`; }, 1200);
    } else {
      toast(`Error: ${data.detail || 'Unknown error'}`, 'danger');
    }
  } catch (e) {
    toast('Network error.', 'danger');
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<i class="bi bi-play-fill me-1"></i>Launch Scan';
  }
});

loadStats();
setInterval(loadStats, 15000);
</script>
</body>
</html>
