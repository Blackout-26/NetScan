<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NetScan — Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <style>
    :root { --ns-dark:#0f172a; --ns-panel:#1e293b; --ns-border:#334155; --ns-accent:#38bdf8; }
    body {
      background: var(--ns-dark);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }
    .login-card {
      background: var(--ns-panel);
      border: 1px solid var(--ns-border);
      border-radius: 16px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 25px 50px rgba(0,0,0,.5);
    }
    .brand { font-size: 2rem; font-weight: 800; color: var(--ns-accent); letter-spacing: -.02em; }
    .brand span { color: #f1f5f9; }
    .form-control {
      background: #0f172a;
      border: 1px solid var(--ns-border);
      color: #e2e8f0;
      border-radius: 8px;
    }
    .form-control:focus {
      background: #0f172a;
      border-color: var(--ns-accent);
      color: #e2e8f0;
      box-shadow: 0 0 0 3px rgba(56,189,248,.15);
    }
    .form-label { color: #94a3b8; font-size: .875rem; }
    .btn-login {
      background: var(--ns-accent);
      color: #0f172a;
      font-weight: 700;
      border: none;
      border-radius: 8px;
      padding: .7rem;
      font-size: 1rem;
      transition: opacity .15s;
    }
    .btn-login:hover { opacity: .9; color: #0f172a; }
    .btn-login:disabled { opacity: .6; }
    .default-hint {
      background: rgba(56,189,248,.07);
      border: 1px solid rgba(56,189,248,.2);
      border-radius: 8px;
      padding: .75rem 1rem;
      font-size: .8rem;
      color: #94a3b8;
    }
    .default-hint code { color: var(--ns-accent); }
    .alert-error {
      background: rgba(239,68,68,.1);
      border: 1px solid rgba(239,68,68,.3);
      color: #fca5a5;
      border-radius: 8px;
      padding: .75rem 1rem;
      font-size: .875rem;
    }
    .eye-toggle {
      background: #0f172a;
      border: 1px solid var(--ns-border);
      border-left: none;
      color: #64748b;
      cursor: pointer;
      border-radius: 0 8px 8px 0;
    }
    .eye-toggle:hover { color: var(--ns-accent); background: #0f172a; }
  </style>
</head>
<body>
<div class="login-card">
  <!-- Brand -->
  <div class="text-center mb-4">
    <div class="brand mb-1"><i class="bi bi-radar"></i> Net<span>Scan</span></div>
    <p class="text-muted mb-0" style="font-size:.85rem;">Network Port Scanner & Risk Analyzer</p>
  </div>

  <!-- Default credentials hint -->
  <div class="default-hint mb-4">
    <i class="bi bi-info-circle me-1"></i>
    Default credentials &mdash; <code>admin</code> / <code>NetScan@Admin1</code><br>
    <span style="font-size:.75rem;">You will be prompted to change these on first login.</span>
  </div>

  <!-- Error message -->
  <div id="error-box" class="alert-error mb-3 d-none"></div>

  <!-- Login form -->
  <div>
    <div class="mb-3">
      <label class="form-label">Username</label>
      <input id="username" type="text" class="form-control" placeholder="admin" autocomplete="username" />
    </div>
    <div class="mb-4">
      <label class="form-label">Password</label>
      <div class="input-group">
        <input id="password" type="password" class="form-control" placeholder="••••••••••••" autocomplete="current-password" />
        <button class="eye-toggle btn" type="button" id="toggle-pw" tabindex="-1">
          <i class="bi bi-eye" id="eye-icon"></i>
        </button>
      </div>
    </div>
    <button id="btn-login" class="btn btn-login w-100" type="button">
      <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
    </button>
  </div>

  <p class="text-center text-muted mt-3 mb-0" style="font-size:.75rem;">
    <i class="bi bi-shield-lock me-1"></i>Session expires after 8 hours of inactivity.
  </p>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
const API = '/api/v1';

// Password visibility toggle
document.getElementById('toggle-pw').addEventListener('click', () => {
  const pw = document.getElementById('password');
  const icon = document.getElementById('eye-icon');
  if (pw.type === 'password') {
    pw.type = 'text';
    icon.className = 'bi bi-eye-slash';
  } else {
    pw.type = 'password';
    icon.className = 'bi bi-eye';
  }
});

// Login
async function doLogin() {
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  const btn = document.getElementById('btn-login');
  const errBox = document.getElementById('error-box');

  if (!username || !password) {
    errBox.textContent = 'Please enter both username and password.';
    errBox.classList.remove('d-none');
    return;
  }

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Signing in…';
  errBox.classList.add('d-none');

  try {
    const res = await fetch(`${API}/auth/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password }),
      credentials: 'same-origin',
    });
    const data = await res.json();

    if (res.ok) {
      // Redirect: first login goes to /setup, otherwise /
      window.location.href = data.is_first_login ? '/setup' : '/';
    } else {
      errBox.textContent = data.detail || 'Login failed.';
      errBox.classList.remove('d-none');
    }
  } catch (e) {
    errBox.textContent = 'Network error. Is the server running?';
    errBox.classList.remove('d-none');
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<i class="bi bi-box-arrow-in-right me-2"></i>Sign In';
  }
}

document.getElementById('btn-login').addEventListener('click', doLogin);
document.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

// Auto-focus username
document.getElementById('username').focus();
</script>
</body>
</html>
