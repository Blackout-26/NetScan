<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NetScan — Scan History</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <style>
    :root { --ns-dark:#0f172a; --ns-panel:#1e293b; --ns-border:#334155; --ns-accent:#38bdf8; }
    body { background:var(--ns-dark); color:#e2e8f0; }
    .sidebar { width:240px; min-height:100vh; background:var(--ns-panel); border-right:1px solid var(--ns-border); position:fixed; top:0; left:0; z-index:100; }
    .sidebar .brand { font-size:1.4rem; font-weight:700; color:var(--ns-accent); padding:1.25rem 1.5rem; border-bottom:1px solid var(--ns-border); }
    .sidebar .brand span { color:#f1f5f9; }
    .sidebar .nav-link { color:#94a3b8; padding:.65rem 1.5rem; display:flex; align-items:center; gap:.6rem; font-size:.9rem; }
    .sidebar .nav-link:hover,.sidebar .nav-link.active { background:rgba(56,189,248,.08); color:var(--ns-accent); }
    .main { margin-left:240px; padding:2rem; }
    .card-dark { background:var(--ns-panel); border:1px solid var(--ns-border); border-radius:12px; }
    .table-dark-ns th { background:#1e293b; color:#94a3b8; font-size:.78rem; text-transform:uppercase; letter-spacing:.05em; border-bottom:1px solid var(--ns-border); }
    .table-dark-ns td { border-bottom:1px solid #1e293b; font-size:.875rem; vertical-align:middle; }
    .table-dark-ns { background:var(--ns-panel); color:#e2e8f0; }
  </style>
</head>
<body>
<nav class="sidebar d-flex flex-column">
  <div class="brand"><i class="bi bi-radar"></i> Net<span>Scan</span></div>
  <ul class="nav flex-column mt-2">
    <li><a class="nav-link" href="/"><i class="bi bi-speedometer2"></i> Dashboard</a></li>
    <li><a class="nav-link active" href="/scans"><i class="bi bi-list-check"></i> Scan History</a></li>
    <li><a class="nav-link" href="/settings"><i class="bi bi-gear"></i> Settings</a></li>
    <li><a class="nav-link" href="/api/docs"><i class="bi bi-code-slash"></i> API Docs</a></li>
  </ul>
  <div class="mt-auto p-3">
    <button class="btn btn-outline-danger btn-sm w-100" onclick="fetch('/api/v1/auth/logout',{method:'POST',credentials:'same-origin'}).then(()=>window.location.href='/login')">
      <i class="bi bi-box-arrow-right me-1"></i>Logout
    </button>
  </div>
</nav>
<main class="main">
  <h1 class="fs-4 fw-bold mb-4"><i class="bi bi-list-check me-2 text-info"></i>Scan History</h1>
  <div class="card-dark p-0 overflow-hidden">
    <div class="table-responsive">
      <table class="table table-dark-ns mb-0">
        <thead>
          <tr>
            <th>Target</th><th>Type</th><th>Status</th>
            <th>Hosts</th><th>Open Ports</th><th>Duration</th><th>Created</th><th></th>
          </tr>
        </thead>
        <tbody id="scans-body">
          <tr><td colspan="8" class="text-center py-4 text-muted">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
const API = '/api/v1';
const STATUS_COLORS = {pending:'secondary',running:'primary',completed:'success',failed:'danger',cancelled:'warning'};
async function load() {
  const r = await fetch(`${API}/scans/?limit=100`);
  const d = await r.json();
  const tbody = document.getElementById('scans-body');
  if (!d.scans.length) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center py-4 text-muted">No scans yet.</td></tr>';
    return;
  }
  tbody.innerHTML = d.scans.map(s => `
    <tr>
      <td><code class="text-info">${s.target}</code></td>
      <td><span class="badge bg-secondary">${s.scan_type}</span></td>
      <td><span class="badge bg-${STATUS_COLORS[s.status]||'secondary'}">${s.status}</span></td>
      <td>${s.total_hosts}</td>
      <td>${s.open_ports}</td>
      <td>${s.duration_seconds ? s.duration_seconds.toFixed(1)+'s' : '—'}</td>
      <td class="text-muted">${new Date(s.created_at).toLocaleString()}</td>
      <td><a href="/scans/${s.uuid}" class="btn btn-outline-info btn-sm">View</a></td>
    </tr>
  `).join('');
}
load();
</script>
</body>
</html>
